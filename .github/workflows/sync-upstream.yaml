# Fork-only: merge KalicoCrew/kalico main into this fork's main once a day.
# GITHUB_TOKEN cannot push changes to .github/workflows; if upstream edits a
# workflow the run fails until a SYNC_TOKEN secret (PAT with repo + workflow
# scopes) is added, or the fork is synced by hand.
name: Sync upstream

on:
  schedule:
    - cron: "30 20 * * *" # 03:30 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'buskun/kalico'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch=main --jq '"\(.merge_type): \(.message)"'
